steps:
  # Step 1: Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smartdairy-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smartdairy-ai:latest'
      - '.'

  # Step 2: Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smartdairy-ai:$COMMIT_SHA'

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smartdairy-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smartdairy-ai:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/smartdairy-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/smartdairy-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
